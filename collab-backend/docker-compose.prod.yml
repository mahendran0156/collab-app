version: "3.9"

# ── PRODUCTION docker-compose ─────────────────────────────────────────────────
# Simulates how Render runs your container.
# Usage:
#   docker-compose -f docker-compose.prod.yml up --build
#
# ⚠️  Create a .env file (copy from .env.example) before running this.
#     Never commit .env — it contains your real secrets.

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner          # production-optimised stage
    container_name: collab-backend-prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env                  # reads MONGO_URI, JWT_SECRET, FRONTEND_URL etc.
    environment:
      NODE_ENV: production
      PORT: 5000
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:5000/health', r => r.statusCode===200 ? process.exit(0) : process.exit(1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
