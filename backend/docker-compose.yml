version: "3.9"

# ── LOCAL DEV docker-compose ──────────────────────────────────────────────────
# Usage:
#   docker-compose up --build          → start everything
#   docker-compose up --build backend  → backend only (uses your local MongoDB)
#   docker-compose down -v             → stop + remove volumes

services:

  # ── MongoDB (local dev only — production uses Atlas) ───────────────────────
  mongo:
    image: mongo:6.0
    container_name: collab-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: collabdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps          # use the deps stage so devDependencies are available
    container_name: collab-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/collabdb
      JWT_SECRET: dev_secret_change_in_production
      FRONTEND_URL: http://localhost:5173
    volumes:
      # Mount source for hot reload (nodemon watches for changes)
      - .:/app
      # Prevent host node_modules overwriting container's
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    command: ["node_modules/.bin/nodemon", "--watch", ".", "--ext", "js", "server.js"]

volumes:
  mongo_data:
    driver: local
